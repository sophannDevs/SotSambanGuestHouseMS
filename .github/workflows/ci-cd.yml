name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-ci:
    name: Backend API CI (Java 21 / Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw Executable
        run: chmod +x ./guesthouse-api/mvnw

      - name: Run Backend Tests & Verify Build
        run: |
          cd guesthouse-api
          ./mvnw clean test

  frontend-ci:
    name: Frontend Web CI (Next.js 15 / Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: guesthouse-web/package-lock.json

      - name: Install Dependencies
        run: |
          cd guesthouse-web
          npm ci

      - name: Check TypeScript Types
        run: |
          cd guesthouse-web
          npx tsc --noEmit

      - name: Build Next.js Production Bundle
        run: |
          cd guesthouse-web
          npm run build

  deploy:
    name: Deploy to Production (AWS EC2)
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            REPO_DIR=~/SotSambanGuestHouseMS
            if [ ! -d "$REPO_DIR/.git" ]; then
              echo "Repository not found on server, cloning fresh..."
              git clone https://github.com/sophannDevs/SotSambanGuestHouseMS.git "$REPO_DIR"
            fi
            cd "$REPO_DIR"
            git pull origin main
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh
