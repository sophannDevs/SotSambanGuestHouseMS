name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-ci:
    name: Backend API CI (Java 21 / Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw Executable
        run: chmod +x ./guesthouse-api/mvnw

      - name: Run Backend Tests & Verify Build
        run: |
          cd guesthouse-api
          ./mvnw clean test

  frontend-ci:
    name: Frontend Web CI (Next.js 15 / Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: guesthouse-web/package-lock.json

      - name: Install Dependencies
        run: |
          cd guesthouse-web
          npm ci

      - name: Check TypeScript Types
        run: |
          cd guesthouse-web
          npx tsc --noEmit

      - name: Build Next.js Production Bundle
        run: |
          cd guesthouse-web
          npm run build
