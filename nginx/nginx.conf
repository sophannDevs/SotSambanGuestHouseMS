events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Performance & Optimization
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/x-javascript
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ---------------------------------------------------------------------
    # Rate limiting
    #
    # Zones are keyed by client IP and live in shared memory (10m holds
    # ~160k tracked IPs), so limits survive across requests without hitting
    # the backend. login_zone is deliberately strict to blunt credential
    # stuffing / brute-force against auth endpoints; api_zone is a much
    # looser backstop for the rest of the API so real traffic is unaffected.
    # Rejected requests get 429 instead of nginx's default 503.
    # ---------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=120r/m;
    limit_req_status 429;

    upstream frontend {
        server web:3000;
    }

    upstream backend {
        server api:8080;
    }

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Let's Encrypt / Certbot Challenge Routing
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Auth endpoints: strict per-IP limit against brute-force / credential stuffing
        location ~ ^/api/v1/auth/(login|refresh|forgot-password|reset-password)$ {
            limit_req zone=login_zone burst=3 nodelay;
            proxy_pass http://backend;
        }

        # Backend API Routing
        location /api/ {
            limit_req zone=api_zone burst=40 nodelay;
            proxy_pass http://backend;
        }

        # File Uploads Direct Serving / Proxy
        location /uploads/ {
            proxy_pass http://backend/uploads/;
        }

        # Frontend Application Routing
        location / {
            proxy_pass http://frontend;
        }
    }
}
