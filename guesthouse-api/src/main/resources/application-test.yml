# =============================================================================
#  Guest House Manager API — TEST profile
#
#  Integration tests run against a REAL, locally installed PostgreSQL database
#  named guesthouse_test_db. Testcontainers is deliberately not used because
#  Docker is out of scope for this development stage
#  (see ../docs/conventions.md section 13).
#
#  Create the database once:
#      psql -U postgres -f database/01-create-databases.sql
#
#  Run the tests:
#      ./mvnw verify
# =============================================================================

spring:
  datasource:
    url: jdbc:postgresql://${TEST_DB_HOST:localhost}:${TEST_DB_PORT:5432}/${TEST_DB_NAME:guesthouse_test_db}
    username: ${TEST_DB_USERNAME:${DB_USERNAME:postgres}}
    password: ${TEST_DB_PASSWORD:${DB_PASSWORD:postgres}}
    hikari:
      pool-name: guesthouse-test-pool
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    # Each test run starts from an empty schema so tests never inherit state.
    clean-disabled: false
    clean-on-validation-error: true
    locations: classpath:db/migration

app:
  security:
    jwt:
      # Fixed, obviously-fake secret so tests are deterministic and need no .env.
      secret: test_only_secret_do_not_use_anywhere_else_0123456789abcdefghijklmnop
      access-expiration-minutes: 30
      refresh-expiration-days: 7
  file:
    # Tests write into target/, which `mvnw clean` removes.
    upload-dir: target/test-uploads
  seed:
    # Tests build their own fixtures; demo seeding would make them fragile.
    demo-data: false
  local:
    enabled: false
    log-password-reset-links: false
    allow-data-reset: false

logging:
  level:
    root: WARN
    com.guesthouse: INFO
    org.flywaydb: INFO
    org.springframework.test: WARN
