# Maven Wrapper configuration
#
# distributionUrl is the Apache Maven distribution the wrapper scripts use when
# no Maven is already installed on the machine. The scripts in this project use
# the "only-script" approach: there is no maven-wrapper.jar to commit, the shell
# scripts download and unpack the distribution themselves.
#
# To upgrade Maven, change the version in distributionUrl. To regenerate the
# official upstream wrapper scripts once you have Maven installed, run:
#     mvn wrapper:wrapper -Dmaven=3.9.9
wrapperVersion=3.3.2
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
